[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "logfusion"
version = "1.0.0"
description = "Log parsing, multi-source fusion and graph-based root-cause ranking for anomaly detection."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Behnam Yousefi" }]
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
logfusion = "logfusion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
